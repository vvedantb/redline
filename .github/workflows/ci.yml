name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    uses: vvedantb/packages/.github/workflows/ci-app.yml@main
    with:
      package_manager: npm
      runs_on: boat-large
      env: |
        CI=1
      # Same order as before. The package builds first because the demos import its dist output.
      keep_going: false
      commands: |
        npm run lint:tests
        npm run lint
        npm run build -w @vvedantb/redline
        npm run typecheck
        npm test
      playwright_browsers: chromium
      e2e_command: |
        npm run test:e2e
        npm run test:compare
        npm run build
      failure_artifact_paths: |
        playwright-report/
        test-results/

  # The reusable workflow uploads artifacts only on failure. The PR diff report
  # is uploaded on every run, so this step stays local.
  pr-diff:
    runs-on: ubuntu-latest
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pr-diff
      - uses: actions/upload-artifact@v4
        with:
          name: pr-diff-report
          path: e2e/artifacts/
