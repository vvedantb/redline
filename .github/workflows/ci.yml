name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    uses: vvedantb/packages/.github/workflows/ci-app.yml@main
    with:
      package_manager: npm
      runs_on: boat-large
      env: |
        CI=1
      # parallel runs every command and fails at the end if any failed, so it needs keep_going: true.
      # A failing command still fails the Check job. Typecheck needs the package build, so those two share a line.
      keep_going: true
      parallel: true
      max_parallel: 0
      fetch_depth: 0
      affected_tests: true
      full_run_paths: |
        ^scripts/
        ^examples/
        ^e2e/
      commands: |
        npm run lint:tests
        npm run lint
        npm run build -w @vvedantb/redline && npm run typecheck
        npm test -- ${VV_TEST_CHANGED:+$VV_TEST_CHANGED --passWithNoTests}
      # The runner image apt sources fail "playwright install --with-deps" (PPA label change, 20 November 2026),
      # so the browser installs here without it. One build of the package, then the Playwright suite, both compare checks and the
      # demo and landing builds at the same time. See scripts/ci-e2e.mjs.
      e2e_command: |
        npx playwright install chromium
        node scripts/ci-e2e.mjs
      failure_artifact_paths: |
        playwright-report/
        test-results/

  # The reusable workflow uploads artifacts only on failure. The PR diff report
  # is uploaded on every run, so this step stays local.
  pr-diff:
    runs-on: ubuntu-latest
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # scripts/pr-diff-e2e.mjs launches the Chrome that ubuntu-latest ships
      # (/usr/bin/google-chrome) and never uses Playwright's own Chromium, so the
      # apt and browser download is skipped. Without that Chrome it still runs.
      - name: Install Playwright Chromium when the runner has no Chrome
        run: |
          if [ -x /usr/bin/google-chrome ]; then
            echo "Using $(/usr/bin/google-chrome --version)"
          else
            npx playwright install --with-deps chromium
          fi
      - run: npm run test:pr-diff
      - uses: actions/upload-artifact@v4
        with:
          name: pr-diff-report
          path: e2e/artifacts/
