name: Release

on:
  push:
    branches: [main]
    # Only a changeset file can lead to a version pull request or a publish:
    # adding a changeset and merging the Version Packages pull request both
    # change .changeset/. Other pushes to main have nothing to release, so
    # they do not start a run. Use workflow_dispatch to run it by hand.
    paths:
      - ".changeset/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and check only. Do not version or publish.
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  # One job, so npm ci and the package build run once. The CI workflow already
  # runs lint, tests and e2e for the commit, so they are not repeated here.
  release:
    name: Release
    runs-on: ubuntu-latest
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Trusted Publishing (OIDC) only. setup-node has no registry-url, so it
      # writes no auth config to .npmrc.
      # Trusted Publishing needs npm >= 11.5.1.
      - run: npm install -g npm@^11.5.1
      - run: npm ci

      # The package publishes dist, so build it. The demo and landing builds
      # are not published, and CI already covers them.
      - name: Build package
        run: npm run build -w @vvedantb/redline

      # Fast typecheck of the package. The demo resolves the package to dist,
      # so the build above comes first.
      - name: Typecheck package
        run: npm run typecheck -w @vvedantb/redline

      # Dry run: no versioning, no publish.
      - name: Changeset status
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        continue-on-error: true
        run: npx changeset status
      # Set a throwaway version in the runner only, so the check passes when
      # the current version is already on npm. Nothing is committed.
      - name: Set throwaway dry-run version
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npm version 0.0.0-dryrun.0 --no-git-tag-version -w @vvedantb/redline
      - name: npm publish (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npm publish --dry-run --tag dryrun -w @vvedantb/redline

      # Normal path: Version Packages PR, or publish when it merges.
      - name: Version PR or publish
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          title: 'Version Packages'
          commit: 'Version Packages'
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
